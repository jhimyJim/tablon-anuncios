{% extends 'base.html' %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5 col-lg-4">

        <div class="card shadow-lg">

            <div class="card-body p-4">

                <h3 class="text-center text-primary fw-bold mb-2">
                    Iniciar Sesión
                </h3>

                <p class="text-center text-muted mb-4">
                    Tablón de Anuncios
                </p>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Correo electrónico
                        </label>

                        <input type="email"
                               name="correo"
                               class="form-control"
                               placeholder="Ingrese su correo"
                               required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Contraseña
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Ingrese su contraseña"
                               required>

                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Ingresar al sistema
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
