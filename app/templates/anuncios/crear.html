{% extends 'base.html' %}

{% block title %}Nuevo Anuncio{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h3 class="text-primary mb-4">Registrar Anuncio</h3>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">Título del anuncio</label>

                        <input type="text"
                               name="titulo"
                               class="form-control"
                               maxlength="150"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Contenido</label>

                        <textarea name="contenido"
                                  class="form-control"
                                  rows="6"
                                  required></textarea>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">Categoría</label>

                        <select name="id_categoria" class="form-select" required>

                            {% for categoria in categorias %}

                                <option value="{{ categoria.id }}">
                                    {{ categoria.nombre }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <button type="submit" class="btn btn-primary">
                        Publicar Anuncio
                    </button>

                    <a href="{{ url_for('anuncios.listar') }}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
