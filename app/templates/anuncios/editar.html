{% extends 'base.html' %}

{% block title %}Modificar Anuncio{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h3 class="text-primary mb-4">Modificar Anuncio</h3>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">Título</label>

                        <input type="text"
                               name="titulo"
                               class="form-control"
                               value="{{ anuncio.titulo }}"
                               maxlength="150"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Contenido</label>

                        <textarea name="contenido"
                                  class="form-control"
                                  rows="6"
                                  required>{{ anuncio.contenido }}</textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Categoría</label>

                        <select name="id_categoria" class="form-select" required>

                            {% for categoria in categorias %}

                                <option value="{{ categoria.id }}"
                                    {% if anuncio.id_categoria == categoria.id %}selected{% endif %}>
                                    {{ categoria.nombre }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">Estado</label>

                        <select name="estado" class="form-select">

                            <option value="publicado"
                                {% if anuncio.estado == 'publicado' %}selected{% endif %}>
                                Publicado
                            </option>

                            <option value="inactivo"
                                {% if anuncio.estado == 'inactivo' %}selected{% endif %}>
                                Inactivo
                            </option>

                        </select>

                    </div>

                    <button type="submit" class="btn btn-primary">
                        Actualizar Anuncio
                    </button>

                    <a href="{{ url_for('anuncios.listar') }}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
