{% extends 'base.html' %}

{% block title %}Modificar Usuario{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h3 class="text-primary mb-4">Modificar Usuario</h3>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">Nombre completo</label>

                        <input type="text"
                               name="nombre"
                               class="form-control"
                               value="{{ usuario.nombre }}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Correo electrónico</label>

                        <input type="email"
                               name="correo"
                               class="form-control"
                               value="{{ usuario.correo }}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Nueva contraseña</label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Dejar vacío para mantener la actual">

                    </div>

                    <div class="mb-4">

                        <label class="form-label">Rol</label>

                        <select name="rol" class="form-select">

                            <option value="usuario"
                                {% if usuario.rol == 'usuario' %}selected{% endif %}>
                                Usuario
                            </option>

                            <option value="admin"
                                {% if usuario.rol == 'admin' %}selected{% endif %}>
                                Administrador
                            </option>

                        </select>

                    </div>

                    <button type="submit" class="btn btn-primary">
                        Actualizar Usuario
                    </button>

                    <a href="{{ url_for('usuarios.listar') }}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
